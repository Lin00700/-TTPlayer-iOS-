name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint Info.plist
        run: |
          set -e
          plutil -lint TTPlayer/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" TTPlayer/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" TTPlayer/Info.plist
          /usr/libexec/PlistBuddy -c "Print :LSSupportsOpeningDocumentsInPlace" TTPlayer/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" TTPlayer/Info.plist
          test -f TTPlayer/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project TTPlayer.xcodeproj \
            -scheme TTPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -80 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Verify app bundle
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/TTPlayer.app"
          test -d "$APP" || { echo "::error::TTPlayer.app missing"; exit 1; }
          echo "== CFBundleIdentifier"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          echo "== Versions"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          echo "== Background audio"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$APP/Info.plist" | grep -q audio
          echo "== Architecture"
          lipo -info "$APP/TTPlayer"
          echo "== Icon / assets"
          test -f "$APP/Assets.car" || echo "::warning::Assets.car missing"
          ls "$APP" | grep -qi "AppIcon" && echo "AppIcon asset present" || echo "::warning::AppIcon asset not found in bundle"

      - name: Package IPA
        run: |
          set -e
          rm -rf Payload TTPlayer-unsigned.ipa checksum.txt
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/TTPlayer.app" Payload/
          zip -qry TTPlayer-unsigned.ipa Payload
          shasum -a 256 TTPlayer-unsigned.ipa | tee checksum.txt
          ls -lh TTPlayer-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTPlayer-unsigned
          path: TTPlayer-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TTPlayer build ${{ github.run_number }}
          body: |
            未签名 IPA（${{ github.sha }}）。

            用全能签 / 轻松签自签后安装；安装前先删掉桌面上的旧版本。
            传歌：App 内右上角 Wi-Fi 图标 → 浏览器打开页面即可拖拽上传。
          files: |
            TTPlayer-unsigned.ipa
            checksum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
